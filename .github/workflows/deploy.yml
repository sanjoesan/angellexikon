name: Deploy Angellexikon zu GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechte, die der GITHUB_TOKEN für das Pages-Deployment braucht
permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur ein Deployment gleichzeitig
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build mit Astro
        uses: withastro/action@v3
        # site/base werden hier passend zum Repository gesetzt,
        # damit Canonical-URLs & Sitemap korrekt sind.
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
